; Raises PHP upload limits for the gallery/media admin uploaders so large
; phone-recorded videos (iPhone clips routinely exceed the old 8-50MB
; defaults) aren't silently rejected before they even reach app code.
; Only takes effect where the host's PHP runs as CGI/FPM and permits
; per-directory .user.ini overrides; harmless no-op otherwise.
upload_max_filesize = 320M
post_max_size = 340M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
